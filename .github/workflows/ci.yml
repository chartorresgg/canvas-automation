name: CI — Canvas LMS Automation

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  secret-scan:
    name: Secretos — gitleaks
    runs-on: ubuntu-latest

    steps:
      # fetch-depth 0 es obligatorio: sin historial completo el escaneo
      # solo vería el último commit y no detectaría un secreto introducido
      # y removido en commits anteriores.
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # --redact impide que un secreto detectado se imprima en los logs,
      # que son públicos en este repositorio.
      - name: Escanear historial completo
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --verbose

  backend-tests:
    name: Backend — pytest (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ejecutar tests unitarios
        working-directory: backend
        run: python -m pytest tests/unit/ -v --tb=short

  frontend-check:
    name: Frontend — TypeScript (Node 18)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Verificar tipos TypeScript
        working-directory: frontend
        run: npx tsc --noEmit --skipLibCheck --ignoreDeprecations 6.0